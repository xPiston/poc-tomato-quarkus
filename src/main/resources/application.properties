quarkus.application.name=poc-tomato-quarkus

# Le frontend React est partage avec les autres POC de la famille et attend du
# snake_case ("resource_id", "starts_at"). Les records Java restent en
# camelCase ; Jackson traduit a la frontiere.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# --- Regles metier (voir config/BookingProperties) --------------------------
booking.min-duration-minutes=15
booking.max-duration-minutes=480
booking.max-days-ahead=30
booking.pending-expiration-minutes=15
booking.penalty-threshold-hours=24
booking.mail-from=no-reply@booking.test

# --- Base de donnees --------------------------------------------------------
# Flyway possede le schema, Hibernate ne le touche jamais. "Use PostgreSQL,
# with Flyway for database migrations" (tomato, Recommendations).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# En dev et en test, Quarkus demarre un PostgreSQL ephemere via Dev Services
# (Testcontainers) tant qu'aucune URL n'est configuree : rien a lancer a la
# main, et les tests tournent sur le vrai moteur.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:secret}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://db:5432/app}

# Port 0 = le systeme en choisit un libre. Sur une machine partagee, le 8081
# par defaut des @QuarkusTest est souvent deja pris, et la suite echoue sur un
# "Address already in use" qui n'a rien a voir avec le code. REST Assured lit
# le port effectif, donc rien d'autre a regler.
quarkus.http.test-port=0

# --- Tache planifiee --------------------------------------------------------
# Coupee sous test : chaque test maitrise son horloge et son jeu de donnees,
# une tache qui expire des reservations en arriere-plan les rendrait instables.
%test.quarkus.scheduler.enabled=false

# --- Mail -------------------------------------------------------------------
quarkus.mailer.from=no-reply@booking.test
%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.host=${MAILER_HOST:localhost}
%dev.quarkus.mailer.port=${MAILER_PORT:1025}
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${MAILER_HOST:mailpit}
%prod.quarkus.mailer.port=${MAILER_PORT:1025}
%test.quarkus.mailer.mock=true

# --- CORS -------------------------------------------------------------------
# La SPA est servie depuis un autre port que l'API.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
